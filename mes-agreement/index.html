async function adminLogin(){
 const {data:{session}}=await supabase.auth.getSession();
 if(session){adminUser=session.user;await loadAdmin();return}
 const m=document.getElementById('modal'),b=document.getElementById('modalbox');m.classList.add('show');

 document.getElementById('adminLoginForm').onsubmit=async(e)=>{e.preventDefault();const msg=document.getElementById('adminLoginMsg');msg.innerHTML='<div class="notice">Signing in…</div>';const email=document.getElementById('adminEmail').value.trim(),password=document.getElementById('adminPassword').value;const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error){msg.innerHTML='<div class="notice">'+esc(error.message)+'</div>';return}adminUser=data.user;await loadAdmin()};

async function adminRequest(method='GET',body){const {data:{session}}=await supabase.auth.getSession();if(!session)throw new Error('Admin session expired. Please sign in again.');const res=await fetch(SUPABASE_URL+'/functions/v1/mes-admin',{method,headers:{Authorization:'Bearer '+session.access_token,apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'Admin request failed');return data;} async function loadAdmin(){try{const data=await adminRequest('GET');adminRows=data.enrollments||[];showAdmin();}catch(error){alert(error.message||'Admin access denied');}}
function showAdmin(){const m=document.getElementById('modal'),b=document.getElementById('modalbox');m.classList.add('show');const total=adminRows.length,signed=adminRows.filter(x=>x.status==='signed').length,pending=adminRows.filter(x=>x.status!=='signed').length,due=adminRows.reduce((s,x)=>s+Number(x.commissionDue||0)-Number(x.amountPaid||0),0);b.innerHTML=`<div class="admin"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2>MES Admin Dashboard</h2><p class="muted">${esc(adminUser?.email||'Admin')}</p></div><button class="btn outline" id="logout">Sign out</button></div><div class="stats"><div class="stat">Total Sellers<strong>${total}</strong></div><div class="stat">Signed<strong>${signed}</strong></div><div class="stat">Pending<strong>${pending}</strong></div><div class="stat">Balance Due<strong>₹${Math.max(0,due).toLocaleString('en-IN')}</strong></div></div><div class="tablewrap"><table class="table"><thead><tr><th>Seller</th><th>Owner</th><th>Registration Date</th><th>Status</th><th>Net Sales</th><th>Commission</th><th>Paid</th><th>Balance</th><th></th></tr></thead><tbody>${adminRows.map((r,i)=>`<tr><td>${esc(r.legalName)}</td><td>${esc(r.ownerName)}</td><td>${r.enrolledAt?new Date(r.enrolledAt).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'-'}</td><td>${r.status}</td><td>₹${Number(r.netSales||0).toLocaleString('en-IN')}</td><td>₹${Number(r.commissionDue||0).toLocaleString('en-IN')}</td><td>₹${Number(r.amountPaid||0).toLocaleString('en-IN')}</td><td>₹${Math.max(0,Number(r.commissionDue||0)-Number(r.amountPaid||0)).toLocaleString('en-IN')}</td><td><button class="btn outline" data-edit="${i}">Manage</button></td></tr>`).join('')}</tbody></table></div></div>`;document.getElementById('logout').onclick=async()=>{await supabase.auth.signOut();closeModal()};b.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>editSeller(adminRows[Number(x.dataset.edit)]));}
function editSeller(r){const b=document.getElementById('modalbox');b.innerHTML=`<h2>Manage Seller</h2><div class="notice success"><strong>Registration Date:</strong> ${r.enrolledAt?new Date(r.enrolledAt).toLocaleString('en-IN',{dateStyle:'long',timeStyle:'short'}):'Not available'}${r.signedAt?'<br><strong>Agreement Signed:</strong> '+new Date(r.signedAt).toLocaleString('en-IN',{dateStyle:'long',timeStyle:'short'}):''}</div><div class="row"><div class="field"><label>Business Name</label><input id="aLegal" value="${esc(r.legalName)}"></div><div class="field"><label>Owner</label><input id="aOwner" value="${esc(r.ownerName)}"></div><div class="field"><label>Email</label><input id="aEmail" value="${esc(r.email)}"></div><div class="field"><label>Mobile</label><input id="aPhone" value="${esc(r.phone)}"></div><div class="field"><label>GST Status</label><input id="aGst" value="${esc(r.gstStatus)}"></div><div class="field"><label>Account Status</label><select id="aStatus"><option value="active">Active</option><option value="on_hold">On Hold</option><option value="closed">Closed</option></select></div><div class="field"><label>Net Sales (₹)</label><input id="aSales" type="number" min="0" value="${Number(r.netSales||0)}"></div><div class="field"><label>Amount Paid (₹)</label><input id="aPaid" type="number" min="0" value="${Number(r.amountPaid||0)}"></div><div class="field"><label>Payment Status</label><select id="aPay"><option>Pending</option><option>Partially Paid</option><option>Paid</option></select></div><div class="field full"><label>Address</label><textarea id="aAddr" rows="2">${esc(r.address)}</textarea></div><div class="field full"><label>Admin Notes</label><textarea id="aNotes" rows="3">${esc(r.notes||'')}</textarea></div></div><div class="actions"><button class="btn outline" id="backAdmin">Back</button><button class="btn primary" id="saveAdmin">Save Seller & Settlement</button></div>`;document.getElementById('aStatus').value=r.accountStatus||'active';document.getElementById('aPay').value=r.paymentStatus||'Pending';document.getElementById('backAdmin').onclick=showAdmin;document.getElementById('saveAdmin').onclick=async()=>{const body={sellerId:r.sellerId,legalName:v('aLegal'),ownerName:v('aOwner'),email:v('aEmail'),phone:v('aPhone'),address:v('aAddr'),gstStatus:v('aGst'),accountStatus:v('aStatus'),netSales:Number(v('aSales')||0),amountPaid:Number(v('aPaid')||0),paymentStatus:v('aPay'),notes:v('aNotes')};try{await adminRequest('PUT',body);await loadAdmin()}catch(error){alert(error.message||'Save failed')}};}

async function showPasswordRecovery(){
 const m=document.getElementById('modal'),b=document.getElementById('modalbox');m.classList.add('show');
 b.innerHTML=`<h2>Set Admin Password</h2><p class="muted">Create a new password for your MES admin account.</p><div id="recoveryMsg"></div><form id="recoveryForm"><div class="field"><label>New Password</label><input id="newAdminPassword" type="password" minlength="8" required autocomplete="new-password"></div><div class="field"><label>Confirm Password</label><input id="confirmAdminPassword" type="password" minlength="8" required autocomplete="new-password"></div><div class="actions"><button class="btn primary">Save Password</button></div></form>`;
 document.getElementById('recoveryForm').onsubmit=async(e)=>{e.preventDefault();const p=document.getElementById('newAdminPassword').value,q=document.getElementById('confirmAdminPassword').value,msg=document.getElementById('recoveryMsg');if(p!==q){msg.innerHTML='<div class="notice">Passwords do not match.</div>';return}msg.innerHTML='<div class="notice">Saving password…</div>';const {error}=await supabase.auth.updateUser({password:p});if(error){msg.innerHTML='<div class="notice">'+esc(error.message)+'</div>';return}msg.innerHTML='<div class="notice success">Password saved. Opening Admin Dashboard…</div>';const {data:{user}}=await supabase.auth.getUser();adminUser=user;history.replaceState({},document.title,window.location.pathname);setTimeout(()=>loadAdmin(),500)};
}

supabase.auth.onAuthStateChange((event,session)=>{

 if(event==='SIGNED_OUT') adminUser=null;
