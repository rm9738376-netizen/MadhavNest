<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Madhav Ecom Solution | Seller Growth & Agreement</title>
<style>
:root{--navy:#062444;--navy2:#0b3867;--orange:#ff6b00;--muted:#667085;--line:#e7ebf0;--bg:#f7f9fc}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--navy);background:#fff}button,input,select,textarea{font:inherit}button{cursor:pointer}
.top{background:var(--navy);color:#fff;padding:7px 5%;font-size:12px;display:flex;justify-content:space-between}.nav{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;background:#fff;z-index:5}.brand{font-weight:900;font-size:18px}.brand b{color:var(--orange);font-size:28px;margin-right:8px}.links{display:flex;gap:24px;font-size:13px;font-weight:700}.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:800}.primary{background:var(--orange);color:#fff}.outline{background:#fff;border:1px solid var(--orange);color:var(--orange)}
.hero{background:linear-gradient(120deg,#031f3e,#0a3867);color:#fff;padding:80px 7%;display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center}.hero h1{font-size:clamp(40px,5vw,68px);line-height:1.02;margin:12px 0}.hero p{font-size:18px;line-height:1.6;color:#dbe7f5}.pill{display:inline-block;background:rgba(255,107,0,.15);color:#ffb27a;padding:8px 12px;border-radius:99px;font-weight:800;font-size:12px}.card{background:#fff;color:var(--navy);border-radius:22px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.rate{font-size:54px;font-weight:900;color:var(--orange)}.rate small{font-size:18px;color:var(--navy)}
section{padding:70px 7%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.feature{padding:25px;border:1px solid var(--line);border-radius:16px;background:#fff}.feature h3{margin:10px 0}.feature p{color:var(--muted);line-height:1.6}.center{text-align:center}.muted{color:var(--muted)}
footer{background:var(--navy);color:#fff;padding:40px 7%;line-height:1.7}.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modalbox{background:#fff;border-radius:18px;max-width:900px;width:100%;max-height:92vh;overflow:auto;padding:28px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px;margin:8px 0}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800}.field input,.field select,.field textarea{border:1px solid #d8dee8;border-radius:9px;padding:11px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}.notice{padding:12px;border-radius:10px;background:#fff5ec;color:#8a3b00;margin:10px 0}.success{background:#edf9f1;color:#12633a}.agreement{background:#f7f9fc;padding:20px;border-radius:12px;line-height:1.7}.admin{background:var(--bg);min-height:100vh;padding:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#fff;border:1px solid var(--line);padding:18px;border-radius:14px}.stat strong{display:block;font-size:25px;margin-top:5px}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;margin-top:20px}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}@media(max-width:800px){.hero{grid-template-columns:1fr;padding:55px 6%}.links{display:none}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.field.full{grid-column:auto}.stats{grid-template-columns:1fr 1fr}.nav{height:68px}section{padding:55px 6%}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { PDFDocument, StandardFonts, rgb } from 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/+esm';

const SUPABASE_URL='https://edpjkcatuiavqcqyvmau.supabase.co';
const SUPABASE_KEY='sb_publishable_IlrdMAwn1s4BSKLhRGbNcg_neyARKqNq';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const app=document.getElementById('app');
let enrollment=null, adminRows=[], adminUser=null;

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shell(){
app.innerHTML=`<div class="top"><span>Seller Growth & Marketplace Services</span><span>7984185596 · info@madhavecomsolution.com</span></div>
<nav class="nav"><div class="brand"><b>MES</b>Madhav Ecom Solution</div><div class="links"><a href="#services">Services</a><a href="#method">Madhav Method</a><a href="#contact">Contact</a></div><button class="btn outline" id="adminBtn">Admin</button></nav>
<header class="hero"><div><span class="pill">MEESHO + FLIPKART GROWTH</span><h1>We Help Sellers Grow Online.</h1><p>Marketplace management, listing optimization, seller growth and performance support — built for Meesho and Flipkart sellers.</p><button class="btn primary" id="startBtn">Start Growing →</button></div>
<div class="card"><div class="muted">Our commercial model</div><div class="rate">5% <small>of Net Sales</small></div><p>No fixed monthly fee. No minimum fee. Transparent seller-growth partnership.</p><button class="btn primary" id="enrollBtn">Seller Enrollment</button></div></header>
<section id="services"><div class="center"><h2>What MES Handles</h2><p class="muted">End-to-end marketplace support for growing sellers.</p></div><div class="grid"><div class="feature"><h3>Listing & SEO</h3><p>Titles, attributes, keywords, images and marketplace-ready listings.</p></div><div class="feature"><h3>Growth Management</h3><p>Catalog improvement, pricing support, campaigns and marketplace execution.</p></div><div class="feature"><h3>Seller Operations</h3><p>Performance tracking, order insights, returns/RTO review and reporting.</p></div></div></section>
<section id="method" style="background:var(--bg)"><div class="center"><h2>The Madhav Method</h2><p class="muted">Catalog → Visibility → Conversion → Scale</p></div></section>
<footer id="contact"><strong>Madhav Ecom Solution</strong><br>1st Floor, Soham Sandhiya, Odhav Ring Road, Ramol, Ahmedabad - 382449, Gujarat, India<br>7984185596 · 7016150598 · info@madhavecomsolution.com</footer>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>`;
document.getElementById('startBtn').onclick=openEnroll;document.getElementById('enrollBtn').onclick=openEnroll;document.getElementById('adminBtn').onclick=adminLogin;
}
function openEnroll(){
const m=document.getElementById('modal'),b=document.getElementById('modalbox');m.classList.add('show');
b.innerHTML=`<h2>Seller Enrollment</h2><p class="muted">Complete your details to review the 12-month MES agreement.</p><div id="msg"></div>
<form id="reg"><div class="row"><div class="field"><label>Business / Legal Name</label><input name="legalName" required></div><div class="field"><label>Owner / Authorized Signatory</label><input name="ownerName" required></div><div class="field"><label>Email</label><input type="email" name="email" required></div><div class="field"><label>Mobile Number</label><input name="phone" maxlength="10" required></div><div class="field full"><label>Business Address</label><textarea name="address" rows="3" required></textarea></div><div class="field"><label>Marketplace</label><select name="marketplace"><option>Meesho + Flipkart</option><option>Meesho</option><option>Flipkart</option></select></div><div class="field"><label>GST Status</label><select name="gstStatus"><option>Registered</option><option>Not Registered</option><option>Applied / In Process</option></select></div></div><div class="actions"><button type="button" class="btn outline" onclick="closeModal()">Cancel</button><button class="btn primary">Continue to Agreement</button></div></form>`;
document.getElementById('reg').onsubmit=register;
}
window.closeModal=()=>document.getElementById('modal').classList.remove('show');
async function register(e){e.preventDefault();const seller=Object.fromEntries(new FormData(e.target).entries());const msg=document.getElementById('msg');msg.innerHTML='<div class="notice">Saving registration…</div>';const {data,error}=await supabase.functions.invoke('mes-public',{body:{action:'enroll',...seller}});if(error){msg.innerHTML='<div class="notice">'+esc(error.message||'Registration failed')+'</div>';return}enrollment=data.enrollment;showAgreement();}
function showAgreement(){document.getElementById('modalbox').innerHTML=`<h2>Seller Growth & Marketplace Services Agreement</h2><div class="agreement"><p><strong>Term:</strong> 12 months</p><p><strong>Commercial:</strong> MES receives 5% of Net Sales.</p><p><strong>Fixed Monthly Fee:</strong> None</p><p><strong>Minimum Fee:</strong> None</p><p><strong>Marketplace:</strong> ${esc(enrollment.marketplace)}</p><hr><p>This commercial template is generated from the enrollment information. Parties should obtain independent legal review before relying on it as a final contract.</p></div><form id="sign"><div class="field"><label>Full Legal Name / Signatory</label><input id="signer" value="${esc(enrollment.ownerName)}" required></div><label><input type="checkbox" id="accept"> I have read and accept the agreement terms.</label><div id="msg"></div><div class="actions"><button type="button" class="btn outline" onclick="closeModal()">Cancel</button><button class="btn primary">Sign Agreement</button></div></form>`;document.getElementById('sign').onsubmit=sign;}
async function sign(e){e.preventDefault();const signer=document.getElementById('signer').value.trim(),ok=document.getElementById('accept').checked,msg=document.getElementById('msg');if(!ok){msg.innerHTML='<div class="notice">Please accept the agreement terms.</div>';return}msg.innerHTML='<div class="notice">Signing…</div>';const {data,error}=await supabase.functions.invoke('mes-public',{body:{action:'sign',enrollmentId:enrollment.id,signerName:signer}});if(error){msg.innerHTML='<div class="notice">'+esc(error.message||'Signing failed')+'</div>';return}enrollment=data.enrollment;msg.innerHTML='<div class="notice success"><strong>Agreement signed successfully.</strong><br>Enrollment ID: '+esc(enrollment.id)+'</div><div class="actions"><button class="btn primary" id="pdfBtn">Download Agreement PDF</button><button class="btn outline" onclick="closeModal()">Close</button></div>';document.getElementById('pdfBtn').onclick=()=>downloadPdf(enrollment,signer);}
async function downloadPdf(e,signer){const pdf=await PDFDocument.create(),font=await pdf.embedFont(StandardFonts.Helvetica),bold=await pdf.embedFont(StandardFonts.HelveticaBold),p=pdf.addPage([595,842]),navy=rgb(.035,.145,.29),orange=rgb(1,.42,0);p.drawRectangle({x:0,y:766,width:595,height:76,color:navy});p.drawText('MES',{x:48,y:795,size:25,font:bold,color:rgb(1,1,1)});p.drawText('MADHAV ECOM SOLUTION',{x:106,y:801,size:13,font:bold,color:rgb(1,1,1)});p.drawText('SELLER GROWTH & MARKETPLACE SERVICES AGREEMENT',{x:48,y:720,size:15,font:bold,color:navy});let y=685;for(const [k,v] of [['Enrollment ID',e.id],['Seller',e.legalName],['Owner / Signatory',signer],['Email',e.email],['Mobile',e.phone],['Marketplace',e.marketplace],['Term','12 months'],['Commission','5% of Net Sales'],['Fixed Monthly Fee','None'],['Minimum Fee','None'],['Signed',new Date().toLocaleDateString('en-IN')]]){p.drawText(k+':',{x:48,y,size:10,font:bold,color:navy});p.drawText(String(v).slice(0,82),{x:175,y,size:10,font,color:rgb(.2,.25,.3)});y-=27}p.drawText('Madhav Ecom Solution',{x:48,y:340,size:12,font:bold,color:navy});p.drawText('1st Floor, Soham Sandhiya, Odhav Ring Road, Ramol, Ahmedabad - 382449, Gujarat, India',{x:48,y:322,size:8,font,color:rgb(.36,.43,.52)});p.drawText('7984185596 | 7016150598 | info@madhavecomsolution.com',{x:48,y:307,size:8,font,color:rgb(.36,.43,.52)});p.drawText('Important: This document is a commercial template; obtain independent legal review before relying on it as a final contract.',{x:48,y:260,size:8,font,color:orange});const bytes=await pdf.save(),blob=new Blob([bytes],{type:'application/pdf'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Madhav-Ecom-Agreement-'+e.id+'.pdf';a.click();URL.revokeObjectURL(url);}
async function adminLogin(){const {data:{session}}=await supabase.auth.getSession();if(!session){const email=prompt('Enter your admin email:','rm9738376@gmail.com');if(!email)return;const {error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:window.location.origin}});if(error)alert(error.message);else alert('Magic login link sent. Open the link from your email, then click Admin again.');return}adminUser=session.user;loadAdmin();}
async function loadAdmin(){const {data,error}=await supabase.functions.invoke('mes-admin',{method:'GET'});if(error){alert(error.message||'Admin access denied');return}adminRows=data.enrollments||[];showAdmin();}
function showAdmin(){const m=document.getElementById('modal'),b=document.getElementById('modalbox');m.classList.add('show');const total=adminRows.length,signed=adminRows.filter(x=>x.status==='signed').length,pending=adminRows.filter(x=>x.status!=='signed').length,due=adminRows.reduce((s,x)=>s+Number(x.commissionDue||0)-Number(x.amountPaid||0),0);b.innerHTML=`<div class="admin"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2>MES Admin Dashboard</h2><p class="muted">${esc(adminUser?.email||'Admin')}</p></div><button class="btn outline" id="logout">Sign out</button></div><div class="stats"><div class="stat">Total Sellers<strong>${total}</strong></div><div class="stat">Signed<strong>${signed}</strong></div><div class="stat">Pending<strong>${pending}</strong></div><div class="stat">Balance Due<strong>₹${Math.max(0,due).toLocaleString('en-IN')}</strong></div></div><div class="tablewrap"><table class="table"><thead><tr><th>Seller</th><th>Owner</th><th>Status</th><th>Net Sales</th><th>Commission</th><th>Paid</th><th>Balance</th><th></th></tr></thead><tbody>${adminRows.map((r,i)=>`<tr><td>${esc(r.legalName)}</td><td>${esc(r.ownerName)}</td><td>${r.status}</td><td>₹${Number(r.netSales||0).toLocaleString('en-IN')}</td><td>₹${Number(r.commissionDue||0).toLocaleString('en-IN')}</td><td>₹${Number(r.amountPaid||0).toLocaleString('en-IN')}</td><td>₹${Math.max(0,Number(r.commissionDue||0)-Number(r.amountPaid||0)).toLocaleString('en-IN')}</td><td><button class="btn outline" data-edit="${i}">Manage</button></td></tr>`).join('')}</tbody></table></div></div>`;document.getElementById('logout').onclick=async()=>{await supabase.auth.signOut();closeModal()};b.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>editSeller(adminRows[Number(x.dataset.edit)]));}
function editSeller(r){const b=document.getElementById('modalbox');b.innerHTML=`<h2>Manage Seller</h2><div class="row"><div class="field"><label>Business Name</label><input id="aLegal" value="${esc(r.legalName)}"></div><div class="field"><label>Owner</label><input id="aOwner" value="${esc(r.ownerName)}"></div><div class="field"><label>Email</label><input id="aEmail" value="${esc(r.email)}"></div><div class="field"><label>Mobile</label><input id="aPhone" value="${esc(r.phone)}"></div><div class="field"><label>GST Status</label><input id="aGst" value="${esc(r.gstStatus)}"></div><div class="field"><label>Account Status</label><select id="aStatus"><option value="active">Active</option><option value="on_hold">On Hold</option><option value="closed">Closed</option></select></div><div class="field"><label>Net Sales (₹)</label><input id="aSales" type="number" min="0" value="${Number(r.netSales||0)}"></div><div class="field"><label>Amount Paid (₹)</label><input id="aPaid" type="number" min="0" value="${Number(r.amountPaid||0)}"></div><div class="field"><label>Payment Status</label><select id="aPay"><option>Pending</option><option>Partially Paid</option><option>Paid</option></select></div><div class="field full"><label>Address</label><textarea id="aAddr" rows="2">${esc(r.address)}</textarea></div><div class="field full"><label>Admin Notes</label><textarea id="aNotes" rows="3">${esc(r.notes||'')}</textarea></div></div><div class="actions"><button class="btn outline" id="backAdmin">Back</button><button class="btn primary" id="saveAdmin">Save Seller & Settlement</button></div>`;document.getElementById('aStatus').value=r.accountStatus||'active';document.getElementById('aPay').value=r.paymentStatus||'Pending';document.getElementById('backAdmin').onclick=showAdmin;document.getElementById('saveAdmin').onclick=async()=>{const body={sellerId:r.sellerId,legalName:v('aLegal'),ownerName:v('aOwner'),email:v('aEmail'),phone:v('aPhone'),address:v('aAddr'),gstStatus:v('aGst'),accountStatus:v('aStatus'),netSales:Number(v('aSales')||0),amountPaid:Number(v('aPaid')||0),paymentStatus:v('aPay'),notes:v('aNotes')};const {error}=await supabase.functions.invoke('mes-admin',{method:'PUT',body});if(error){alert(error.message||'Save failed');return}await loadAdmin()};}
const v=id=>document.getElementById(id).value;
shell();
</script>
</body></html>
